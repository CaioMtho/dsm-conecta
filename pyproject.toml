[project]
name = "dsm-conecta-workspace"
version = "0.1.0"
description = "Workspace raiz do projeto DSM Conecta"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "apps/*",
    "packages/*"
]
exclude = [
    "apps/client"
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]

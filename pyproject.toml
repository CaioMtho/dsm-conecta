[project]
name = "dsm-conecta-workspace"
version = "0.1.0"
description = "Workspace raiz do projeto DSM Conecta"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "apps/*",
    "packages/*"
]
exclude = [
    "apps/client"
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
markers = [
    "integration: testes de integração que exigem o broker MQTT em execução",
]

[dependency-groups]
dev = [
    "paho-mqtt>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.4",
]

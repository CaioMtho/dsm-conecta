[project]
name = "ingestor"
version = "0.1.0"
description = "Serviço assíncrono de ingestão MQTT com validação de esquemas e persistência no TimescaleDB"
requires-python = ">=3.12"
dependencies = [
    "aiomqtt>=2.3.0",
    "asyncpg>=0.30.0",
    "schemas",
]

[tool.uv.sources]
schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestor"]

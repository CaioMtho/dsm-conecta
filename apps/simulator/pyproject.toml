[project]
name = "simulator"
version = "0.1.0"
description = "Nó sensor simulado para contagem de fluxo de visitantes via MQTT"
requires-python = ">=3.12"
dependencies = [
    "pytest",
    "paho-mqtt>=2.1.0",
    "schemas",
]

[tool.uv.sources]
schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]